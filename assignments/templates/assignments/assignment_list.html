<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Assignments</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-4xl mx-auto py-10 px-6">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <a href="{% url 'users:dashboard' %}"
                    class="bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-4 py-2 rounded-lg font-medium transition-colors shadow-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                    </svg> Back
                </a>
                <h2 class="text-2xl font-bold">Assignment Library</h2>
            </div>
            <a href="{% url 'assignments:create' %}"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg shadow-sm transition-colors text-sm">
                + New
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <ul class="divide-y divide-slate-100">
                {% for assignment in assignments %}
                <li class="p-6 hover:bg-slate-50 transition-colors flex justify-between items-start">
                    <div>
                        <h3 class="font-semibold text-lg text-slate-800">{{ assignment.title }}</h3>
                        <p class="text-sm text-slate-500 mt-1">{{ assignment.description }}</p>
                    </div>
                    <span
                        class="text-xs font-medium bg-slate-100 text-slate-500 py-1 px-3 rounded-full border border-slate-200">
                        {{ assignment.created_at|date:"M d, Y" }}
                    </span>
                </li>
                {% empty %}
                <li class="p-8 text-center text-slate-500">
                    <p>No assignments found. Start by creating your first exercise.</p>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-900 via-slate-800 to-zinc-900 min-h-screen flex items-center justify-center p-4">
    <div class="text-center">
        <h1
            class="text-9xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-purple-500 mb-4 drop-shadow-lg">
            404</h1>
        <h2 class="text-3xl font-semibold text-slate-100 mb-6 tracking-wide">Endpoint Not Found</h2>
        <p class="text-slate-400 mb-8 max-w-md mx-auto text-lg leading-relaxed">The internal Campus Code Lab system
            could not locate the execution block you requested.</p>
        <a href="/"
            class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-8 rounded-xl shadow-lg transition-all duration-300 hover:-translate-y-1 hover:shadow-blue-500/50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
                </path>
            </svg>
            Return to Dashboard
        </a>
    </div>
</body>

</html>

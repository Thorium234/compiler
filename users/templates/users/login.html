<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Code Lab - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Style django forms generically */
        form p {
            margin-bottom: 1rem;
        }

        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 0.25rem;
        }

        form input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.375rem;
            color: #f3f4f6;
        }

        form input:focus {
            outline: none;
            border-color: #3b82f6;
            ring: 2px solid #3b82f6;
        }

        .glass {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-900 via-slate-800 to-zinc-900 min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-md rounded-2xl shadow-2xl p-8 transform transition-all hover:scale-[1.01]">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-400">
                Campus Code Lab</h2>
            <p class="text-gray-400 mt-2 text-sm">Secure lightweight development environment</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"
                class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 rounded-lg shadow-lg hover:shadow-blue-500/30 transition-all duration-200">
                Authenticate Securely
            </button>
        </form>
    </div>

</body>

</html>
